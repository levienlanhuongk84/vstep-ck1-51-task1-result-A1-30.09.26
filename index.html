<!doctype html>
<html lang="en">
<head>

<title>VSTEP Results CK1-51 · A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: 3 columns like a marking screen — student list | original essay with numbered errors | scores & corrections; one column below 1100px */
:root{
--bg:#F6F4F9;--surface:#FFFFFF;--sunk:#F1EDF6;--line:#E4DEEC;--fg:#221B2C;--muted:#6E6579;
--accent:#613087;--accent-soft:#EEE6F5;--orange:#DD5A28;--gold:#FCB715;
--kG:#C42F4A;--kGbg:#FCE6EA;--kV:#C2531F;--kVbg:#FDEBDD;--kO:#613087;--kObg:#EEE6F5;--kT:#16758A;--kTbg:#DDF1F4;
--ok:#2E7D4F;--warn:#B5660F;--bad:#C42F4A;
--ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;--text:"Literata",Georgia,"Times New Roman",serif;
--r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#17131D;--surface:#211C29;--sunk:#2A2433;--line:#3A3245;--fg:#EEE9F4;--muted:#A79DB4;
--accent:#B98BE0;--accent-soft:#33264A;--orange:#F08A5D;--gold:#FCC94A;
--kG:#FF8A9E;--kGbg:#4A2230;--kV:#FFA371;--kVbg:#4A2C1E;--kO:#C9A0F0;--kObg:#35274A;--kT:#6FD0E2;--kTbg:#1D3B42;
--ok:#6CCB92;--warn:#F2B25C;--bad:#FF8A9E;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#17131D;--surface:#211C29;--sunk:#2A2433;--line:#3A3245;--fg:#EEE9F4;--muted:#A79DB4;
--accent:#B98BE0;--accent-soft:#33264A;--orange:#F08A5D;--gold:#FCC94A;
--kG:#FF8A9E;--kGbg:#4A2230;--kV:#FFA371;--kVbg:#4A2C1E;--kO:#C9A0F0;--kObg:#35274A;--kT:#6FD0E2;--kTbg:#1D3B42;
--ok:#6CCB92;--warn:#F2B25C;--bad:#FF8A9E;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.5;margin:0}
.wrap{padding-inline:16px;padding-block:16px 40px;max-width:1500px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,mark:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--orange)}
h1{font-size:24px;line-height:1.25;margin:2px 0 0;text-wrap:balance;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;min-width:76px}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:250px minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* sidebar */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden}
.side-h{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-h input,.mob select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--fg);font:inherit}
.sortrow{display:flex;gap:6px}
.sortrow button{flex:1;border:1px solid var(--line);background:none;border-radius:7px;padding:4px;font-size:12px;color:var(--muted)}
.sortrow button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.list{overflow:auto;padding:6px}
.li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px}
.li:hover{background:var(--sunk)}
.li[aria-current="true"]{background:var(--accent-soft)}
.li .no{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.li .nm{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .fl{display:block;font-size:11px;color:var(--warn)}
.pill{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;border-radius:999px;padding:2px 8px;min-width:38px;text-align:center}
.b-hi{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.b-mid{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.b-lo{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.b-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.mob{display:none}
.mob-row{display:flex;gap:8px;align-items:center}.mob-row select{flex:1;min-width:0;min-height:44px}.navbtn{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;color:var(--accent)}.navbtn:disabled{opacity:.35}
#essayCard{scroll-margin-top:76px}
button,mark,select{-webkit-tap-highlight-color:transparent}
/* essay */
.ess-h{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.who{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 220px}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.who b{display:block;font-size:16px}
.who span{color:var(--muted);font-size:12.5px}
.meta{display:flex;gap:18px;flex-wrap:wrap}
.meta div{display:flex;flex-direction:column;font-size:12.5px}
.meta span{color:var(--muted);font-size:11px}
.meta b{font-weight:600;font-variant-numeric:tabular-nums}
.prompt{margin:14px 18px 0;padding:10px 14px;background:var(--sunk);border-radius:10px;font-size:13px;color:var(--muted)}
.prompt b{color:var(--fg)}
.flag{margin:10px 18px 0;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--fg);font-size:13px;border-left:3px solid var(--warn)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 18px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="false"]{opacity:.45}
.chip b{font-variant-numeric:tabular-nums}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;border:0;background:none;padding:2px}
.switch .tr{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-pressed="true"] .tr{background:var(--accent)}
.switch[aria-pressed="true"] .tr::after{transform:translateX(14px)}
.essay{font-family:var(--text);font-size:16.5px;line-height:1.95;padding:14px 18px 6px;max-width:68ch}
.essay p{margin:0 0 .7em}
mark{background:var(--bgk);color:inherit;border-radius:4px;padding:1px 2px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-bottom:2px solid var(--ck)}
mark .n{font-family:var(--ui);font-size:10.5px;font-weight:700;color:#fff;background:var(--ck);border-radius:4px;padding:0 4px;margin-right:4px;vertical-align:2px;line-height:1.5;display:inline-block}
:root[data-theme="dark"] mark .n{color:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark .n{color:var(--bg)}}
mark.k-G{--ck:var(--kG);--bgk:var(--kGbg)}mark.k-V{--ck:var(--kV);--bgk:var(--kVbg)}mark.k-O{--ck:var(--kO);--bgk:var(--kObg)}mark.k-T{--ck:var(--kT);--bgk:var(--kTbg)}
mark.hid{background:none;border-bottom-color:transparent;cursor:default}mark.hid .n{display:none}
mark.on{outline:2px solid var(--ck);outline-offset:1px}
mark del{text-decoration-thickness:1.5px;opacity:.6}
mark ins{text-decoration:none;font-weight:600;color:var(--ck)}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 18px 14px;border-top:1px solid var(--line);margin-top:8px;color:var(--muted);font-size:12.5px}
.nav{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
/* panel */
.panel{display:flex;flex-direction:column;gap:16px}
.sec{padding:14px 16px}
.sec h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2 small{font-weight:500;color:var(--muted);font-size:12px}
.scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sc{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.sc span{font-size:11.5px;color:var(--muted);font-weight:500}
.sc b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.sc b small{font-size:12px;color:var(--muted);font-weight:500}
.bar{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold))}
.overall{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;background:var(--accent-soft);border-radius:10px}
.overall b{font-size:24px;color:var(--accent);font-variant-numeric:tabular-nums}
.overall span{font-size:12.5px;color:var(--muted)}
.cmt{margin:0;line-height:1.6}
.gl{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.gl li{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--sunk);display:flex;gap:8px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:1px 6px;white-space:nowrap;align-self:flex-start;margin-top:2px}
.tag.k-G{color:var(--kG);background:var(--kGbg)}.tag.k-V{color:var(--kV);background:var(--kVbg)}.tag.k-O{color:var(--kO);background:var(--kObg)}.tag.k-T{color:var(--kT);background:var(--kTbg)}
.errs{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto;padding-right:2px}
.er{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;width:100%}
.er:hover{background:var(--sunk)}
.er.on{border-color:var(--ck);box-shadow:0 0 0 1px var(--ck)}
.er.k-G{--ck:var(--kG)}.er.k-V{--ck:var(--kV)}.er.k-O{--ck:var(--kO)}.er.k-T{--ck:var(--kT)}
.er .n{width:22px;height:22px;border-radius:6px;background:var(--ck);color:var(--surface);font-weight:700;font-size:11.5px;display:grid;place-items:center}
.er .q{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ck) 70%,transparent);color:var(--muted);overflow-wrap:anywhere}
.er .f{font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
.er .f::before{content:"→ ";color:var(--ck)}
.er .w{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap}
.er.hid{display:none}
.rw{font-family:var(--text);font-size:15px;line-height:1.75;border-left:3px solid var(--accent);padding-left:14px}
.rw p{margin:0 0 .45em}
.copyrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pop{position:absolute;z-index:20;max-width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(20,10,30,.18);padding:10px 12px;font-size:13px}
.pop .f{font-weight:600;white-space:pre-line}
.pop .w{color:var(--muted);font-size:12px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px}
.solo .side,.solo .stats,.solo .nav,.solo .mob,.solo .teach{display:none!important}
.solo .grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:1100px){.grid,.solo .grid{grid-template-columns:minmax(0,1fr)}.side{display:none}.mob{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);margin:0 -16px 12px;padding:8px 16px;border-bottom:1px solid var(--line)}.errs{max-height:none}}
@media (max-width:520px){.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:6px}.stat{min-width:0;padding:5px 8px}.stat b{font-size:15px}.scores{grid-template-columns:repeat(2,minmax(0,1fr))}.essay{font-size:15.5px}h1{font-size:20px}}
@media (pointer:coarse){.chip{min-height:36px;padding:6px 12px 6px 10px}.switch{min-height:40px}.btn{min-height:40px}.sortrow button{min-height:36px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
const DATA=[{"n":1,"name":"HV01","w":135,"t":"","d":"","s":[9,9,8,8],"cmt":"Strong answer: all 3 points covered, each with a reason. Just make a few phrases sound more natural and sign your name at the end.","rw":["Dear Jack,","Thanks for your email, and congratulations on the new job!","First of all, I think Green Park would suit you best. It's really convenient, the rent is fairly cheap, and there are lots of shops and restaurants nearby, so you'll find everything you need right on your doorstep.","As for getting to work, I'd take the metro. There's a fast line that goes straight to your office, so you'll avoid the rush-hour traffic.","Finally, if you want to stay active and make friends on Saturdays, try the sports club near my place. You can play badminton there, and the people are really friendly.","Let me know when you arrive – I can't wait to see you!","Best wishes,","[Your name]"],"o":"Dear Jack,\nThanks for your email. Congratulations on your new job!\nFirst of all, I think the Green Park area would suit you best. It is a very convenient place with relatively cheap rent, and there are lots of shops and restaurants nearby. You can easily find anything you need right in this neighborhood.\nAs for getting to work, I’d recommend taking the metro. There is a fast metro line that goes direct to your office, which will help you avoid heavy traffic jams during rush hours.\nFinally, if you want to stay active and make friends on Saturdays, try the local sports club near my house. You can play badminton there, and it is very easy to meet friendly people.\nLet me know when you arrive. I can't wait to see you!\nBest wishes,","e":[{"s":394,"l":26,"q":"goes direct to your office","fix":"goes straight to your office","why":"‘straight to’ sounds more natural","k":"V","id":1},{"s":442,"l":42,"q":"avoid heavy traffic jams during rush hours","fix":"avoid the rush-hour traffic","why":"common native phrase","k":"V","id":2},{"s":723,"l":12,"q":"Best wishes,","fix":"Best wishes,\ function essayHTML(d){
let h="",p=0;
for(const e of d.e){h+=esc(d.o.slice(p,e.s));

return h.split("\n").map(l=>`<p>${l||"&nbsp;"}</p>`).join("");
}

<div class="card sec"><h2>Natural rewrite <small>keeps the student's ideas</small></h2>
<div class="rw" id="rw">${d.rw.map(l=>`<p>${esc(l)}</p>`).join("")}</div>
<div class="copyrow"><button class="btn" id="cpRw">Copy rewrite</button><button class="btn pri teach" id="cpAll">Copy everything to send</button></div>
<p class="sub teach" style="font-size:12px;margin-top:8px">Link to this essay only: add <code>#hv${d.n}</code> to the end of the page link.</p></div>`;
renderList();bind();
}
function closePop(){document.querySelectorAll(".pop").forEach(p=>p.remove());document.querySelectorAll(".on").forEach(x=>x.classList.remove("on"))}
function focusErr(id,from){
closePop();const d=DATA[cur],e=d.e.find(x=>x.id==id);if(!e)return;
const m=document.querySelector(`mark[data-e="${id}"]`),c=document.querySelector(`.er[data-e="${id}"]`);
m&&m.classList.add("on");c&&c.classList.add("on");
if(from==="mark"&&m){const r=m.getBoundingClientRect(),p=document.createElement("div");p.className="pop";
p.innerHTML=`<span class="tag k-${e.k}">${K[e.k]}</span><div class="f" style="margin-top:6px">→ ${esc(e.fix)}</div><div class="w">${esc(e.why)}</div>`;
document.body.appendChild(p);const w=p.offsetWidth;let x=r.left+scrollX;x=Math.max(16,Math.min(x,document.documentElement.clientWidth-w-16));
p.style.left=x+"px";p.style.top=(r.bottom+scrollY+6)+"px";
if(c){const box=c.closest(".errs");if(box&&box.scrollHeight>box.clientHeight)box.scrollTop=c.offsetTop-box.offsetTop-60}}
if(from==="list"&&m)m.scrollIntoView({block:"center",behavior:"smooth"});
}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Copied")}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied")}catch(x){toast("Couldn't copy – select the text and copy it")}ta.remove()}}
function bind(){
document.querySelectorAll("mark[data-e]").forEach(m=>{const f=ev=>{ev.stopPropagation();if(!m.classList.contains("hid"))focusErr(m.dataset.e,"mark")};m.onclick=f;m.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();f(ev)}}});
document.querySelectorAll(".er").forEach(b=>b.onclick=ev=>{ev.stopPropagation();focusErr(b.dataset.e,"list")});
document.querySelectorAll(".chip[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;off.has(k)?off.delete(k):off.add(k);render()});
$("fix").onclick=()=>{showFix=!showFix;render()};
$("prev").onclick=()=>go(cur-1);$("next").onclick=()=>go(cur+1);
$("cpRw").onclick=()=>copy(DATA[cur].rw.join("\n"));
$("cpAll").onclick=()=>{const d=DATA[cur],a=avg(d.s);copy([`VSTEP WRITING TASK 1 FEEDBACK – ${d.name} (CK1-51)`,`Scores: TF ${d.s[0]} · Org ${d.s[1]} · Vocab ${d.s[2]} · Gram ${d.s[3]} → ${a.toFixed(1)}/10`,"",`Feedback: ${d.cmt}`,...d.g.filter(g=>!g[0].startsWith("⚠")).map(g=>"- "+g[0]),"","ERRORS TO FIX:",...d.e.map(e=>`${e.id}. "${e.q.replace(/\n/g," / ")}" → ${e.fix.replace(/\n/g," / ")} (${e.why})`),"","SUGGESTED REWRITE:",...d.rw].join("\n"))};
document.querySelectorAll(".li").forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function go(i){if(i<0||i>=DATA.length)return;cur=i;closePop();render();$("essayCard").scrollIntoView({block:"start",behavior:"smooth"})}
$("q").oninput=renderList;
$("sel").onchange=e=>go(+e.target.value);
$("mprev").onclick=()=>go(cur-1);$("mnext").onclick=()=>go(cur+1);
addEventListener("scroll",()=>{if(document.querySelector(".pop"))closePop()},{passive:true});
$("s-n").onclick=()=>{sortBy="n";$("s-n").setAttribute("aria-pressed","true");$("s-sc").setAttribute("aria-pressed","false");renderList()};
$("s-sc").onclick=()=>{sortBy="sc";$("s-sc").setAttribute("aria-pressed","true");$("s-n").setAttribute("aria-pressed","false");renderList()};
document.addEventListener("click",closePop);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop();if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;if(e.key==="ArrowRight"&&e.altKey)go(cur+1);if(e.key==="ArrowLeft"&&e.altKey)go(cur-1)});
render();
</script>
</body>
</html>
